[package]
name = "sharex-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure Rust utility tools for ShareX in Rust: color picker, pixel ruler, file hashing, directory indexer, image combiner, and QR generator."

[dependencies]
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false }
