[package]
name = "sharex-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ShareX-style native egui desktop application, global hotkeys, region overlay, image editor, and CLI."

[[bin]]
name = "sharex"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
chrono.workspace = true
clap.workspace = true
eframe.workspace = true
serde.workspace = true
sharex-capture = { path = "../sharex-capture" }
sharex-core = { path = "../sharex-core" }
sharex-editor = { path = "../sharex-editor" }
sharex-effects = { path = "../sharex-effects" }
sharex-media = { path = "../sharex-media" }
sharex-tools = { path = "../sharex-tools" }
sharex-uploaders = { path = "../sharex-uploaders" }
toml.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
global-hotkey.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
