name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: voltshot.exe
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: voltshot
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary: voltshot
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            binary: voltshot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libxkbcommon-dev libfontconfig-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p voltshot-app
      - name: Build Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          VOLTSHOT_EMBED_PAYLOAD: "1"
        run: |
          $env:VOLTSHOT_PAYLOAD_PATH = (Resolve-Path "target/$($env:TARGET)/release/$($env:BINARY)").Path
          cargo build --release --target $env:TARGET -p voltshot-installer
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portableDir = "dist/portable-stage"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/$($env:TARGET)/release/$($env:BINARY)" "$portableDir/VoltShot.exe" -Force
          $archive = "dist/VoltShot-$($env:RELEASE_TAG)-$($env:PLATFORM)-portable.zip"
          Compress-Archive -Path "$portableDir/VoltShot.exe" -DestinationPath $archive -Force
          Remove-Item -Recurse -Force $portableDir
          $installer = "dist/VoltShot-Setup-$($env:RELEASE_TAG)-$($env:PLATFORM).exe"
          Copy-Item "target/$($env:TARGET)/release/voltshot-setup.exe" $installer -Force
      - name: Package Linux .deb and portable archive
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          VERSION="${RELEASE_TAG#v}"
          STAGE="dist/voltshot-${RELEASE_TAG}-${PLATFORM}"
          mkdir -p "${STAGE}"
          install -m 755 "target/${TARGET}/release/${BINARY}" "${STAGE}/voltshot"
          install -m 755 packaging/linux/install.sh "${STAGE}/install.sh"
          install -m 644 packaging/linux/voltshot.desktop "${STAGE}/voltshot.desktop"
          install -m 644 assets/voltshot.png "${STAGE}/voltshot.png"
          install -m 644 assets/icon.svg "${STAGE}/icon.svg"
          tar -czf "dist/VoltShot-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C dist "voltshot-${RELEASE_TAG}-${PLATFORM}"
          rm -rf "${STAGE}"

          DEB_ROOT="dist/deb-pkg"
          mkdir -p "${DEB_ROOT}/DEBIAN" \
            "${DEB_ROOT}/usr/bin" \
            "${DEB_ROOT}/usr/share/applications" \
            "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps" \
            "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps"
          install -m 755 "target/${TARGET}/release/${BINARY}" "${DEB_ROOT}/usr/bin/voltshot"
          install -m 644 packaging/linux/voltshot.desktop "${DEB_ROOT}/usr/share/applications/voltshot.desktop"
          install -m 644 assets/voltshot.png "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/voltshot.png"
          install -m 644 assets/icon.svg "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/voltshot.svg"
          cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: voltshot
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgtk-3-0 | libgtk-3-0t64, libayatana-appindicator3-1 | libappindicator3-1, libxcb1, libxrandr2, libdbus-1-3, libfontconfig1
          Maintainer: VoltShot Community <https://github.com/Ciastekbatak/VoltShot>
          Description: Next-gen screenshot, annotation editor, OCR, and screen recording app
           Fast native Rust screenshot and capture utility inspired by ShareX.
          EOF
          dpkg-deb --build --root-owner-group "${DEB_ROOT}" "dist/VoltShot-${RELEASE_TAG}-${PLATFORM}.deb"
          rm -rf "${DEB_ROOT}"
      - name: Package macOS .app bundle, .dmg, and archive
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          VERSION="${RELEASE_TAG#v}"
          APP="dist/VoltShot.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          install -m 755 "target/${TARGET}/release/${BINARY}" "${APP}/Contents/MacOS/voltshot"
          sed "s|<string>0.1.0</string>|<string>${VERSION}</string>|g" packaging/macos/Info.plist > "${APP}/Contents/Info.plist"

          ICONSET="dist/VoltShot.iconset"
          mkdir -p "${ICONSET}"
          for size in 16 32 64 128 256; do
            sips -z "${size}" "${size}" assets/voltshot.png --out "${ICONSET}/icon_${size}x${size}.png" >/dev/null
          done
          cp "${ICONSET}/icon_32x32.png" "${ICONSET}/icon_16x16@2x.png"
          cp "${ICONSET}/icon_64x64.png" "${ICONSET}/icon_32x32@2x.png"
          cp "${ICONSET}/icon_256x256.png" "${ICONSET}/icon_128x128@2x.png"
          sips -z 512 512 assets/voltshot.png --out "${ICONSET}/icon_256x256@2x.png" >/dev/null
          cp "${ICONSET}/icon_256x256@2x.png" "${ICONSET}/icon_512x512.png"
          sips -z 1024 1024 assets/voltshot.png --out "${ICONSET}/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "${ICONSET}" -o "${APP}/Contents/Resources/VoltShot.icns"
          rm -rf "${ICONSET}"

          codesign --force --deep --sign - "${APP}"
          tar -czf "dist/VoltShot-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C dist VoltShot.app

          DMG_STAGE="dist/dmg-stage"
          mkdir -p "${DMG_STAGE}"
          cp -R "${APP}" "${DMG_STAGE}/VoltShot.app"
          ln -s /Applications "${DMG_STAGE}/Applications"
          hdiutil create -volname "VoltShot ${RELEASE_TAG}" -srcfolder "${DMG_STAGE}" -ov -format UDZO "dist/VoltShot-${RELEASE_TAG}-${PLATFORM}.dmg"
          rm -rf "${DMG_STAGE}" "${APP}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
