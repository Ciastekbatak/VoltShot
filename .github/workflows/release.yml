name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: sharex.exe
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: sharex
          - os: macos-latest
            platform: macos-arm64
            binary: sharex
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libxkbcommon-dev libfontconfig-dev
      - name: Build release binary
        run: cargo build --release -p sharex-app
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/sharex-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          Compress-Archive -Path "target/release/${{ matrix.binary }}" -DestinationPath $archive -Force
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/sharex-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C target/release "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
