name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: voltshot.exe
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: voltshot
          - os: macos-latest
            platform: macos-arm64
            binary: voltshot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libxkbcommon-dev libfontconfig-dev
      - name: Build release binary
        run: cargo build --release -p voltshot-app
      - name: Build Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          VOLTSHOT_EMBED_PAYLOAD: "1"
        run: |
          cargo build --release -p voltshot-installer
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portableDir = "dist/portable-stage"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/release/$($env:BINARY)" "$portableDir/VoltShot.exe" -Force
          $archive = "dist/VoltShot-$($env:RELEASE_TAG)-$($env:PLATFORM)-portable.zip"
          Compress-Archive -Path "$portableDir/VoltShot.exe" -DestinationPath $archive -Force
          Remove-Item -Recurse -Force $portableDir
          $installer = "dist/VoltShot-Setup-$($env:RELEASE_TAG)-$($env:PLATFORM).exe"
          Copy-Item "target/release/voltshot-setup.exe" $installer -Force
      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          cp "target/release/${BINARY}" "dist/voltshot"
          tar -czf "dist/VoltShot-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C dist voltshot
          rm -f dist/voltshot
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
