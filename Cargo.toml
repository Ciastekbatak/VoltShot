[workspace]
resolver = "2"
members = [
    "crates/voltshot-core",
    "crates/voltshot-capture",
    "crates/voltshot-editor",
    "crates/voltshot-effects",
    "crates/voltshot-media",
    "crates/voltshot-tools",
    "crates/voltshot-uploaders",
    "crates/voltshot-app",
    "crates/voltshot-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ciastekbatak/VoltShot"
rust-version = "1.85"

[workspace.dependencies]
arboard = { version = "3", features = ["image-data"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
global-hotkey = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
xcap = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
